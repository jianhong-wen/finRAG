[project]
name = "finrag"
version = "0.1.0"
description = "Finance RAG: document search and structured facts in one PostgreSQL database"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, S: security checks
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["finrag"]
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a PostgreSQL database with pgvector (DATABASE_URL)"]
