name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: finrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests use TEST_DATABASE_URL only (ADR 0005).
      TEST_DATABASE_URL: postgresql://finrag:ci-only-password@localhost:5432/finrag_test
      EMBED_BACKEND: hash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Tests
        run: make test
